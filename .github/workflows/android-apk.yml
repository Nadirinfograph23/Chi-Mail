name: Build CHI MAIL Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Install secure native WebView activity
        run: |
          mkdir -p android/app/src/main/java/com/chilyacatering/chimail
          cp native/android/MainActivity.java android/app/src/main/java/com/chilyacatering/chimail/MainActivity.java
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          a = "{http://schemas.android.com/apk/res/android}"
          root.set(a + "usesCleartextTraffic", "false")
          root.set(a + "allowBackup", "false")
          perms = {x.get(a + "name") for x in root.findall("uses-permission")}
          if "android.permission.INTERNET" not in perms:
              root.insert(list(root).index(root.find("application")), ET.Element("uses-permission", {a + "name": "android.permission.INTERNET"}))
          app = root.find("application")
          app.set(a + "icon", "@mipmap/ic_launcher")
          app.set(a + "roundIcon", "@mipmap/ic_launcher_round")
          app.set(a + "label", "CHI MAIL")
          for activity in root.findall(".//activity"):
              for filt in activity.findall("intent-filter"):
                  actions = [x.get(a + "name") for x in filt.findall("action")]
                  cats = [x.get(a + "name") for x in filt.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in cats:
                      activity.set(a + "name", ".MainActivity")
                      activity.set(a + "exported", "true")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
      - name: Apply CHILYA logo to launcher and in-app toolbar
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          src = Image.open("public/chilya-logo.jpg").convert("RGBA")
          yellow = (255,210,26,255)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.contain(src, (int(size*.78),int(size*.78)), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA",(size,size),yellow)
              canvas.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              canvas.save(folder/"ic_launcher.png")
              mask = Image.new("L",(size,size),0)
              ImageDraw.Draw(mask).ellipse((0,0,size-1,size-1),fill=255)
              round_icon = canvas.copy()
              round_icon.putalpha(mask)
              round_icon.save(folder/"ic_launcher_round.png")
          # Android 8+ adaptive launcher icon: explicitly replace the adaptive resources too.
          res = Path("android/app/src/main/res")
          (res/"mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (res/"mipmap-anydpi-v26/ic_launcher.xml").write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/chilya_icon_background"/><foreground android:drawable="@mipmap/chilya_icon_foreground"/></adaptive-icon>', encoding="utf-8")
          (res/"mipmap-anydpi-v26/ic_launcher_round.xml").write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/chilya_icon_background"/><foreground android:drawable="@mipmap/chilya_icon_foreground"/></adaptive-icon>', encoding="utf-8")
          (res/"values").mkdir(parents=True, exist_ok=True)
          colors = res/"values/chilya_icon_colors.xml"
          colors.write_text('<resources><color name="chilya_icon_background">#FFD21A</color></resources>', encoding="utf-8")
          for density,size in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              folder = res/f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              foreground = Image.new("RGBA",(size,size),(0,0,0,0))
              logo = ImageOps.contain(src,(int(size*.68),int(size*.68)),method=Image.Resampling.LANCZOS)
              foreground.alpha_composite(logo,((size-logo.width)//2,(size-logo.height)//2))
              foreground.save(folder/"chilya_icon_foreground.png")
          brand_dir = res/"drawable-nodpi"
          brand_dir.mkdir(parents=True, exist_ok=True)
          brand = ImageOps.contain(src,(192,192),method=Image.Resampling.LANCZOS)
          brand_canvas = Image.new("RGBA",(192,192),yellow)
          brand_canvas.alpha_composite(brand,((192-brand.width)//2,(192-brand.height)//2))
          brand_canvas.save(brand_dir/"chilya_brand.png")
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CHI-MAIL-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
