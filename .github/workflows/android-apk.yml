name: Build CHI MAIL Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Apply CHILYA launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          src = Image.open("public/chilya-logo.jpg").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.contain(src, (size,size), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA",(size,size),(255,210,26,255))
              canvas.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              canvas.convert("RGB").save(folder/"ic_launcher.png", quality=95)
              mask = Image.new("L",(size,size),0)
              ImageDraw.Draw(mask).ellipse((0,0,size-1,size-1),fill=255)
              round_icon = canvas.copy()
              round_icon.putalpha(mask)
              round_icon.save(folder/"ic_launcher_round.png")
          PY
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CHI-MAIL-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
